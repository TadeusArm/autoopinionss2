<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - AutoOpinions</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/img/favicon.jpg">
    <style>
        body { background: url('assets/img/fondoperfiles.jpg') center/cover no-repeat fixed !important; }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <header class="nav-header">
        <div class="header-container">
            <div class="nav-left">
                <a href="muro.html
                " class="nav-logo">Auto Opinions</a>
            </div>
            <nav class="nav-links">
                <a href="muro.html">Inicio</a>
                <a href="add_vehicle.html">Publicar</a>
                <a href="following_feed.html">Siguiendo</a>
            </nav>
            <div class="nav-right" id="nav-profile-container"></div>
        </div>
    </header>

    <div class="card">
        <h2 class="text-center" style="margin-bottom: 30px;">Seguridad</h2>

        <div id="alert-container"></div>

        <div class="form-group">
            <label>Tu contraseña actual</label>
            <input type="password" id="current_password" placeholder="••••••••">
        </div>

        <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 25px 0;"></div>

        <div class="form-group">
            <label>Nueva contraseña</label>
            <input type="password" id="new_password" placeholder="Nueva contraseña">
        </div>

        <button type="button" id="btn-submit" class="btn-submit">Cambiar contraseña</button>

        <div class="text-footer" style="margin-top: 20px;">
            <a href="edit_profile.html">← Cancelar y volver</a>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/change_password.js"></script>
</body>
</html>
