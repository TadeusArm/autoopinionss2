<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AutoOpinions</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.jpg">
    <link rel="stylesheet" href="assets/css/style.css">
<style>
        body { background: url('assets/img/fondo_coche.jpg') center/cover no-repeat fixed; }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <style>
        body { background: url('assets/img/fondo_coche.jpg') center/cover no-repeat fixed; }
    </style>
    <div class="card">
        <h2 class="text-center">REGISTRO</h2>
        <p class="subtitle text-center">Únete a nuestra comunidad del motor</p>

        <div id="alert-container"></div>

        <div id="form-container">
            <form id="register-form">
                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-submit">Registrarme ahora</button>
            </form>
        </div>
        
        <p class="text-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </p>
    </div>

    <script src="assets/js/register.js"></script>
</body>
</html>
